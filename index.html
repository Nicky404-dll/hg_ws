<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Venom-like Geometric Sphere</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #050505; /* Extremely dark background to highlight the venom texture */
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
    // 1. Basic scene setup
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 5;

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    // 2. Track mouse position
    const mouse = new THREE.Vector2(0, 0);
    const targetMouse = new THREE.Vector2(0, 0);
    
    window.addEventListener('mousemove', (event) => {
        // Normalize mouse coordinates to range between -1 and 1
        targetMouse.x = (event.clientX / window.innerWidth) * 2 - 1;
        targetMouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
    });

    // Handle window resize
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // 3. Vertex Shader - Controls geometry deformation
    const vertexShader = `
        uniform float uTime;
        uniform vec2 uMouse;
        varying vec3 vNormal;
        varying vec3 vViewPosition;

        // Simple 3D noise function alternative (using sine/cosine superposition)
        float noise(vec3 p) {
            return sin(p.x * 3.0 + uTime) * cos(p.y * 3.0 + uTime) * sin(p.z * 3.0 + uTime);
        }

        void main() {
            vNormal = normalize(normalMatrix * normal);
            
            // Calculate deformation strength based on mouse position
            float mouseDistance = length(uMouse) * 1.5;
            float distortion = noise(position) * (0.2 + mouseDistance * 0.4);
            
            // Displace vertices along the normal direction
            vec3 newPosition = position + normal * distortion;
            
            vec4 mvPosition = modelViewMatrix * vec4(newPosition, 1.0);
            vViewPosition = -mvPosition.xyz;
            gl_Position = projectionMatrix * mvPosition;
        }
    `;

    // 4. Fragment Shader - Controls venom material (dark, reflective)
    const fragmentShader = `
        varying vec3 vNormal;
        varying vec3 vViewPosition;
        uniform vec2 uMouse;

        void main() {
            vec3 normal = normalize(vNormal);
            vec3 viewDir = normalize(vViewPosition);
            
            // Simulate rim light (Fresnel effect)
            float rim = 1.0 - max(dot(viewDir, normal), 0.0);
            rim = smoothstep(0.6, 1.0, rim);
            
            // Simulate specular highlight
            vec3 lightDir = normalize(vec3(uMouse.x * 5.0, uMouse.y * 5.0, 2.0));
            float spec = pow(max(dot(reflect(-lightDir, normal), viewDir), 0.0), 32.0);
            
            // Venom base color (pure black) + mouse-interactive highlight and rim light (faint purple/white)
            vec3 baseColor = vec3(0.02, 0.02, 0.03); 
            vec3 rimColor = vec3(0.3, 0.3, 0.5) * rim;
            vec3 specColor = vec3(1.0, 1.0, 1.0) * spec * 0.8;

            gl_FragColor = vec4(baseColor + rimColor + specColor, 1.0);
        }
    `;

    // 5. Create material and geometry
    const uniforms = {
        uTime: { value: 0 },
        uMouse: { value: new THREE.Vector2(0, 0) }
    };

    const material = new THREE.ShaderMaterial({
        vertexShader: vertexShader,
        fragmentShader: fragmentShader,
        uniforms: uniforms,
        wireframe: false
    });

    // Use an Icosahedron to generate a high-density sphere
    const geometry = new THREE.IcosahedronGeometry(1.5, 64);
    const sphere = new THREE.Mesh(geometry, material);
    scene.add(sphere);

    // 6. Animation loop
    const clock = new THREE.Clock();

    function animate() {
        requestAnimationFrame(animate);

        // Smoothly interpolate mouse position (adds a viscous feel to the fluid)
        mouse.x += (targetMouse.x - mouse.x) * 0.05;
        mouse.y += (targetMouse.y - mouse.y) * 0.05;

        // Update shader uniforms
        uniforms.uTime.value = clock.getElapsedTime();
        uniforms.uMouse.value.copy(mouse);

        // Slowly rotate the sphere itself
        sphere.rotation.y += 0.002;
        sphere.rotation.x += 0.001;

        renderer.render(scene, camera);
    }

    animate();
</script>

</body>
</html>
