<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>毒液形态几何球体</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #050505; /* 极暗的背景，突出毒液质感 */
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
    // 1. 基础场景设置
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 5;

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    // 2. 跟踪鼠标位置
    const mouse = new THREE.Vector2(0, 0);
    const targetMouse = new THREE.Vector2(0, 0);
    
    window.addEventListener('mousemove', (event) => {
        // 将鼠标坐标归一化到 -1 到 1 之间
        targetMouse.x = (event.clientX / window.innerWidth) * 2 - 1;
        targetMouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
    });

    // 处理窗口缩放
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // 3. 编写顶点着色器 (Vertex Shader) - 控制几何体变形
    const vertexShader = `
        uniform float uTime;
        uniform vec2 uMouse;
        varying vec3 vNormal;
        varying vec3 vViewPosition;

        // 简单的 3D 噪声函数替代方案 (利用三角函数叠加)
        float noise(vec3 p) {
            return sin(p.x * 3.0 + uTime) * cos(p.y * 3.0 + uTime) * sin(p.z * 3.0 + uTime);
        }

        void main() {
            vNormal = normalize(normalMatrix * normal);
            
            // 基于鼠标位置计算形变强度
            float mouseDistance = length(uMouse) * 1.5;
            float distortion = noise(position) * (0.2 + mouseDistance * 0.4);
            
            // 顶点沿法线方向偏移
            vec3 newPosition = position + normal * distortion;
            
            vec4 mvPosition = modelViewMatrix * vec4(newPosition, 1.0);
            vViewPosition = -mvPosition.xyz;
            gl_Position = projectionMatrix * mvPosition;
        }
    `;

    // 4. 编写片元着色器 (Fragment Shader) - 控制毒液材质 (暗黑、反光)
    const fragmentShader = `
        varying vec3 vNormal;
        varying vec3 vViewPosition;
        uniform vec2 uMouse;

        void main() {
            vec3 normal = normalize(vNormal);
            vec3 viewDir = normalize(vViewPosition);
            
            // 模拟边缘光 (Fresnel效应)
            float rim = 1.0 - max(dot(viewDir, normal), 0.0);
            rim = smoothstep(0.6, 1.0, rim);
            
            // 模拟高光
            vec3 lightDir = normalize(vec3(uMouse.x * 5.0, uMouse.y * 5.0, 2.0));
            float spec = pow(max(dot(reflect(-lightDir, normal), viewDir), 0.0), 32.0);
            
            // 毒液基础色 (纯黑) + 鼠标互动的高光和边缘光 (微弱的紫色/白色)
            vec3 baseColor = vec3(0.02, 0.02, 0.03); 
            vec3 rimColor = vec3(0.3, 0.3, 0.5) * rim;
            vec3 specColor = vec3(1.0, 1.0, 1.0) * spec * 0.8;

            gl_FragColor = vec4(baseColor + rimColor + specColor, 1.0);
        }
    `;

    // 5. 创建材质和几何体
    const uniforms = {
        uTime: { value: 0 },
        uMouse: { value: new THREE.Vector2(0, 0) }
    };

    const material = new THREE.ShaderMaterial({
        vertexShader: vertexShader,
        fragmentShader: fragmentShader,
        uniforms: uniforms,
        wireframe: false
    });

    // 使用二十面体来生成高密度的球体
    const geometry = new THREE.IcosahedronGeometry(1.5, 64);
    const sphere = new THREE.Mesh(geometry, material);
    scene.add(sphere);

    // 6. 动画循环
    const clock = new THREE.Clock();

    function animate() {
        requestAnimationFrame(animate);

        // 平滑插值鼠标位置 (增加液体的粘滞感)
        mouse.x += (targetMouse.x - mouse.x) * 0.05;
        mouse.y += (targetMouse.y - mouse.y) * 0.05;

        // 更新着色器变量
        uniforms.uTime.value = clock.getElapsedTime();
        uniforms.uMouse.value.copy(mouse);

        // 让球体自身也缓慢旋转
        sphere.rotation.y += 0.002;
        sphere.rotation.x += 0.001;

        renderer.render(scene, camera);
    }

    animate();
</script>

</body>
</html>
